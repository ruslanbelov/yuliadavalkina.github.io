<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Юлия Давалкина</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #020617;
      padding: 30px;
      border-radius: 16px;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 0 40px rgba(0,0,0,.5);
    }
    img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 15px;
    }
    a {
      display: block;
      margin: 10px 0;
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://via.placeholder.com/120" alt="Юлия">
    <h1>Юлия Давалкина</h1>
    <p>Репортёр • Обзоры • Путешествия</p>

    <a href="#">TikTok</a>
    <a href="#">YouTube</a>
    <a href="#">Telegram</a>
  </div>
</body>
</html>
